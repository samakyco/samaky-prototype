<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Samaky app prototype: find verified volunteer opportunities, check in, and earn verified hours.">
<style>html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Samaky Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
/* Layout: a phone frame centered on a desk surface, with a test-script panel beside it on wide screens; full-screen app on phones. Single brand theme by choice. */
:root{
  --green:#2F6E46; --green-deep:#1F4D33; --brand:#3E8957; --mint:#64D88B; --mint-soft:#E3F1E7;
  --yellow:#F5C842; --yellow-soft:#FCEFC0; --cream:#F5F0E8; --surface:#FFFDF8; --ink:#1A1A1A;
  --quiet:#5C564C; --line:#E4DCCB; --desk:#E2DACB; --bezel:#18201B; --warn-bg:#FDE8CC; --warn-ink:#7C3A06;
  --bad-bg:#F8DCD6; --bad-ink:#8C2A17; --blue:#2563EB; --alert:#C2410C; --scrim:rgba(20,26,22,.48);
  --on-dark:#FFFFFF; --on-dark-quiet:#D6EBDD; --map:#ECE6D9; --road:#FFFDF8; --water:#BBD7E6; --park:#D3E3C8;
  --display:'Fraunces',Georgia,'Times New Roman',serif; --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --tabh:84px; color-scheme:light;
}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.stage{min-height:100%;display:flex;justify-content:center;align-items:center;gap:48px;padding-block:24px;padding-inline:16px}
.phonecol{display:flex;flex-direction:column;align-items:center;gap:14px}
.device{position:relative;width:calc(390px * var(--s,1));height:calc(844px * var(--s,1))}
.frame{position:absolute;top:0;left:0;width:390px;height:844px;transform:scale(var(--s,1));transform-origin:top left;background:var(--cream);border:10px solid var(--bezel);border-radius:48px;overflow:hidden;box-shadow:0 30px 60px rgba(24,32,27,.25)}
.restart{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;border:1px solid #C9BEA8;background:var(--surface);font-size:14px;font-weight:700;color:var(--ink)}
#screen{position:absolute;inset:0}
.scroll{position:absolute;inset:0 0 var(--tabh) 0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.scroll.full{bottom:0}
.scroll.cta{bottom:92px}
.pad{padding-inline:20px}
.disp{font-family:var(--display);font-weight:600;letter-spacing:-.01em;margin:0}
.h1{font-size:26px;line-height:1.12}
.h2{font-size:19px;line-height:1.2}
.q{color:var(--quiet)}
.sm{font-size:13px}
.xs{font-size:12px}
.stack{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g16{gap:16px}.g20{gap:20px}.g24{gap:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;border:none;background:var(--green);color:var(--on-dark);font-weight:700;font-size:16px;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--green);border:1.5px solid var(--green)}
.btn.soft{background:var(--mint-soft);color:var(--green-deep)}
.btn.small{min-height:40px;padding:0 14px;font-size:14px}
.btn.yellow{background:var(--yellow);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:none;color:var(--green);font-weight:700;font-size:14px;padding:10px 0;min-height:44px}
.link.q{color:var(--quiet);font-weight:500;text-decoration:underline}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--mint-soft);color:var(--green-deep)}
.chip.wait{background:var(--warn-bg);color:var(--warn-ink)}
.chip.bad{background:var(--bad-bg);color:var(--bad-ink)}
.chip.in{background:#E6EEFB;color:#1E40AF}
.xp{font-size:12px;font-weight:700;background:var(--yellow-soft);padding:4px 9px;border-radius:999px;white-space:nowrap}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.pill{height:38px;padding:0 14px;border-radius:999px;border:1px solid #D6CCB8;background:var(--surface);font-size:14px;font-weight:500;white-space:nowrap;flex:0 0 auto}
.pill[aria-pressed="true"]{background:var(--green-deep);border-color:var(--green-deep);color:var(--on-dark);font-weight:700}
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.hscroll::-webkit-scrollbar{display:none}
/* header */
.hero{background:var(--green-deep);color:var(--on-dark);padding:26px 20px 18px}
.bar{height:8px;border-radius:4px;background:var(--green);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--mint);border-radius:4px;transition:width .6s}
/* photo placeholder */
.ph{position:relative;background:var(--tint);color:var(--tink);overflow:hidden;flex:0 0 auto}
.ph>svg{position:absolute;inset:0;display:block}
.ph.tall .badge-ver{top:auto;bottom:12px;left:16px}
.badge-acc{position:absolute;right:10px;bottom:10px;width:32px;height:32px;border-radius:16px;background:#1D4ED8;color:#FFFFFF;border:2px solid #FFFFFF;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.ph.tall .badge-acc{width:38px;height:38px;border-radius:19px;right:16px;bottom:12px}
.badge-ver{position:absolute;top:10px;left:10px;display:inline-flex;gap:4px;align-items:center;background:var(--green-deep);color:var(--on-dark);font-size:11px;font-weight:700;padding:5px 9px;border-radius:999px}
.badge-quest{position:absolute;top:10px;right:10px;background:var(--yellow);color:var(--ink);font-size:11px;font-weight:700;padding:5px 9px;border-radius:999px}
.card{display:flex;flex-direction:column;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;padding:0;width:100%}
.card-b{display:flex;flex-direction:column;gap:4px;padding:12px 14px 14px}
.t{font-size:16px;font-weight:700}
/* tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:var(--tabh);background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-start;padding:8px 6px 0;z-index:5}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:60px;min-height:48px;background:none;border:none;color:var(--quiet);font-size:11px;font-weight:500;position:relative}
.tab[aria-current="page"]{color:var(--green);font-weight:700}
.tab.center{margin-top:-24px}
.tab.center .ball{width:54px;height:54px;border-radius:27px;background:var(--green);color:var(--on-dark);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px var(--surface)}
.dot{position:absolute;top:-2px;left:50%;margin-left:6px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--alert);color:var(--on-dark);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.fab{position:absolute;right:16px;bottom:calc(var(--tabh) + 16px);width:64px;height:64px;border-radius:32px;border:3px solid var(--surface);background:var(--yellow-soft);padding:0;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(26,26,26,.2);z-index:6}
.maky{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--yellow-soft);overflow:hidden;flex:0 0 auto}
.maky img{width:86%;height:86%;object-fit:contain;margin-top:4%}
/* sheet */
.scrim{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-end;z-index:20;animation:fade .2s}
.sheet{background:var(--surface);width:100%;border-radius:24px 24px 0 0;padding:12px 20px 28px;max-height:90%;overflow-y:auto;animation:up .25s ease-out}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.toast{position:absolute;left:16px;right:16px;bottom:calc(var(--tabh) + 14px);background:var(--ink);color:var(--on-dark);padding:12px 16px;border-radius:14px;font-size:14px;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.25)}
/* inputs */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:700}
.input{height:50px;border-radius:14px;border:1px solid #D6CCB8;background:var(--surface);padding:0 14px;font-size:16px;width:100%}
.err{color:var(--bad-ink);font-size:13px;font-weight:700}
.flbl{font-size:14px;font-weight:700}
textarea.input{height:auto;padding:12px 14px;line-height:1.45;resize:vertical;font-size:15px}
select.input{padding:0 10px;font-size:15px}
.still{animation:none!important}
.scroll,.sheet{scrollbar-width:none}
.scroll::-webkit-scrollbar,.sheet::-webkit-scrollbar{display:none}
.sthumb{position:absolute;right:3px;width:4px;border-radius:2px;background:rgba(26,26,26,.42);box-shadow:0 0 0 1px rgba(255,255,255,.55);opacity:0;transition:opacity .35s;pointer-events:none;z-index:60}
.sthumb.on{opacity:1}
.npgrid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px;line-height:1.4}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px 0}
.cday{height:42px;border:none;background:none;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:15px;color:var(--ink);padding:0}
.cday i,.cdot{width:6px;height:6px;border-radius:3px;display:block}
.cday.today{box-shadow:inset 0 0 0 1.5px var(--green-deep);font-weight:700}
.cday.sel{background:var(--green-deep);color:#FFFFFF;font-weight:700}
.cday.sel i{box-shadow:0 0 0 1.5px #FFFFFF}
.iconbtn{width:36px;height:36px;flex:0 0 36px;border-radius:18px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--ink);padding:0}
.iconbtn[disabled]{opacity:.3;cursor:default}
.skel{background:linear-gradient(90deg,#E9E1D1,#F4EEE3,#E9E1D1);background-size:200% 100%;animation:sk 1.3s ease-in-out infinite}
@keyframes sk{to{background-position:-200% 0}}
.cause span{flex:0 0 auto}
.sch{--green:#520C77;--green-deep:#3D0959;--brand:#9E26B5;--mint-soft:#F3E8F8;--mint:#D9B8EA}
.seg{display:flex;background:#E9E1D1;border-radius:999px;padding:3px}
.seg button{height:34px;padding:0 16px;border-radius:999px;border:none;background:transparent;font-size:13px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:700}
/* map */
.map{position:relative;height:500px;background:var(--map);overflow:hidden;border-radius:18px}
.map i{position:absolute;display:block}
.pinb{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;padding:0;font-size:11px;font-weight:700}
.pinb span{background:var(--surface);padding:2px 6px;border-radius:6px;white-space:nowrap}
.pinb[aria-pressed="true"] span{background:var(--green-deep);color:var(--on-dark)}
/* cause bubbles */
.cause{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;font-size:12px;font-weight:500;width:66px;flex:0 0 66px;text-align:center;line-height:1.2;padding:0}
.cause span{width:56px;height:56px;border-radius:28px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--green)}
.cause[aria-pressed="true"] span{background:var(--green-deep);color:var(--on-dark);border-color:var(--green-deep)}
/* lotus */
.journey{position:relative}
.journey .jline{position:absolute;left:30px;right:30px;top:20px;height:2px;background:#1A1A1A;display:block}
.journey .nodes{position:relative;display:flex;justify-content:space-between}
.journey .n{display:flex;flex-direction:column;align-items:center;gap:6px;width:60px;font-size:11.5px;background:none;border:none;padding:0;color:var(--ink)}
.journey .jic{height:40px;display:flex;align-items:center;justify-content:center}
.journey .jic span{background:var(--surface);padding:0 5px;display:block}
.qrbtn{margin-left:auto;flex:0 0 auto;background:#FFFFFF;border:none;border-radius:12px;padding:5px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.18)}
/* scanner */
.scan{position:relative;height:220px;border-radius:18px;background:#20271F;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#CFE6D6}
.scan .sq{width:150px;height:150px;border:3px solid var(--mint);border-radius:18px}
.scan .ln{position:absolute;left:25%;right:25%;height:2px;background:var(--mint);top:30%;animation:scan 1.6s ease-in-out infinite alternate}
@keyframes scan{to{top:70%}}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.tnum{font-variant-numeric:tabular-nums}
/* test panel */
.tasks{width:300px;display:flex;flex-direction:column;gap:16px}
.tasks h2{font-family:var(--display);font-weight:600;font-size:26px;margin:0}
.tasks ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.tasks li{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.4}
.tasks li .tick{flex:0 0 24px;height:24px;border-radius:12px;border:2px solid #C9BEA8;display:flex;align-items:center;justify-content:center;color:var(--on-dark)}
.tasks li.done .tick{background:var(--green);border-color:var(--green)}
.tasks li.done{color:var(--quiet)}
@media (max-width:900px){.tasks{display:none}}
@media (max-width:500px) and (pointer:coarse){
  .stage{padding:0;display:block;height:100%}
  .phonecol{height:100%;gap:0}
  .device{width:100%!important;height:100%!important}
  .frame{width:100%;height:100%;transform:none;border:0;border-radius:0;box-shadow:none}
  .restart{display:none}
}
</style>

<div class="stage">
  <div class="phonecol">
    <div class="device" id="device">
      <div class="frame" id="frame">
        <div id="screen"></div>
        <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
      </div>
    </div>
    <button class="restart" id="restart" data-a="reset">Restart from the beginning</button>
  </div>
  <aside class="tasks" id="tasks" aria-label="Test script"></aside>
</div>

 const no=makeProjectOpp(p,chal(p.ch),n,plusDays(o.iso,7));S.myOpps.push(no);syncOpps();
 if(p.mine){S.signups[nid]='signed';requestConsent(nid);notify(`Session ${n} of “${p.title}” is set for ${no.day}.`,'cal','calendar')}

const totalXP=()=>Math.round(totalH()*100)+50*orgs();

 return{h,cur,next,pct:next?Math.max(2,(h-base)/(next.h-base)*100):100,label:cur?cur.n+(cur.p?' · '+cur.p:''):'New Samakian',toNext:next?fmt(next.h-h):'0',xpNext:next?Math.round((next.h-h)*100).toLocaleString():'0'}}

const art=c=>`<svg viewBox="0 0 360 200" preserveAspectRatio="xMidYMid slice" width="100%" height="100%" aria-hidden="true">${ART[c]||`<rect width="360" height="200" fill="${CAUSE[c].bg}"/><circle cx="296" cy="40" r="74" fill="#FFFFFF" opacity=".13"/><circle cx="56" cy="180" r="60" fill="#000000" opacity=".08"/><ellipse cx="180" cy="172" rx="80" ry="11" fill="#000000" opacity=".18"/><g transform="translate(126,30) scale(4.5)" fill="none" stroke="#FFF6EE" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICON[c]||ICON.star}</g>`}</svg>`;
const accBadge=o=>o.accessible?`<span class="badge-acc" role="img" aria-label="Accessible to volunteers with disabilities" title="Accessible to volunteers with disabilities">${ic('Disability',17,2.3)}</span>`:'';
function photo(o,h){return `<div class="ph" style="height:${h}px">${art(o.cause)}${accBadge(o)}<span class="badge-ver">${ic('check',12,3)}Verified ${o.type}</span>${o.quest?'<span class="badge-quest">Quest</span>':o.project?'<span class="badge-quest">Student project</span>':''}</div>`}
function statusChip(s){return {signed:'<span class="chip in">Signed up</span>',checked:'<span class="chip in">Checked in</span>',pending:'<span class="chip wait">Pending</span>',verified:'<span class="chip ok">Verified</span>',notverified:'<span class="chip bad">Not verified</span>'}[s]||''}
function bigCard(o){const s=S.signups[o.id];return `<button class="card" data-a="open" data-v="${o.id}">${photo(o,140)}<span class="card-b"><span class="t">${o.title}</span><span class="sm q">${o.org} · ${o.cause} · ${o.remote?'From home':o.dist+' mi'}</span><span class="row between g8" style="margin-top:8px"><span class="sm">${o.day} · ${o.spots} spots left</span>${s?statusChip(s):`<span class="xp">+${o.hours*100} XP</span>`}</span></span></button>`}
function smallCard(o){const s=S.signups[o.id];return `<button class="card" style="flex:0 0 224px" data-a="open" data-v="${o.id}">${photo(o,112)}<span class="card-b"><span class="t">${o.title}</span><span class="sm q">${o.org} · ${o.remote?'From home':o.dist+' mi'}</span><span style="margin-top:6px">${s?statusChip(s):`<span class="xp">+${o.hours*100} XP</span>`}</span></span></button>`}
function ensureCauses(){S.customCauses.forEach(x=>{if(!CAUSE[x.n])CAUSE[x.n]={bg:x.c,fg:x.c}})}
function myCauses(){const all=[...CAUSES,...S.customCauses.map(x=>x.n)];const o=(S.causeOrder||[...S.causes,...CAUSES.filter(c=>!S.causes.includes(c))]).filter(c=>all.includes(c)&&!S.hiddenCauses.includes(c));all.forEach(c=>{if(!o.includes(c)&&!S.hiddenCauses.includes(c))o.push(c)});return o}
const initials=n=>n.split(/\s+/).filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase();
function clubCard(cl,why){const j=S.joined.includes(cl.id);return `<div class="box stack g8" style="padding:12px 14px"><div class="row g12"><span style="width:44px;height:44px;flex:0 0 44px;border-radius:22px;background:${cl.c};color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px">${esc(initials(cl.n))}</span><span class="stack g4" style="flex:1;min-width:0"><b style="font-size:15px">${esc(cl.n)}</b><span class="xs q">${cl.m+(j?1:0)} member${cl.m+(j?1:0)===1?'':'s'} · ${cl.causes.slice(0,3).join(', ')}${cl.mine&&!cl.open?' · Invite only':''}</span></span>${cl.mine?(cl.status==='review'?'<span class="chip wait">In review</span>':'<span class="chip ok">You lead</span>'):j?'<span class="chip ok">Joined</span>':`<button class="btn small" data-a="clubjoin" data-v="${cl.id}">Join</button>`}</div><p class="sm" style="margin:0;line-height:1.45">${esc(why||cl.about)}</p></div>`}
/* cause matching: Maky AI picks only from verified Samaky data; falls back to simple matching */
function ruleMatch(c){const k=c.toLowerCase();const hit=t=>t.toLowerCase().includes(k)||k.split(/\s+/).some(w=>w.length>3&&t.toLowerCase().includes(w));
 const opps=OPPS.filter(o=>o.cause===c||hit(o.title+' '+o.about)).slice(0,4).map(o=>({id:o.id,why:`A verified ${o.cause.toLowerCase()} shift with ${o.org}.`}));
 const chs=S.challenges.filter(x=>x.cause===c||hit(x.title+' '+x.goal)).map(x=>({id:'ch:'+x.id,why:'Pitch your own project for this open challenge.'}));
 const clubs=allClubs().filter(x=>x.causes.includes(c)||hit(x.n+' '+x.about)).slice(0,3).map(x=>({id:x.id,why:''}));
 return {opps:[...chs,...opps].slice(0,5),clubs,intro:''}}
async function startMatch(c,force){if(!force&&S.ai[c]&&S.ai[c].status==='done')return;S.ai[c]={status:'loading'};render();
 let sample=null;try{sample=window.claude&&window.claude.use?await window.claude.use('sample'):null}catch(e){sample=null}
 if(!sample){S.ai[c]={...ruleMatch(c),status:'done',src:'rules'};render();return}
 const items=[...OPPS.map(o=>`${o.id} | shift | ${o.title} | ${o.org} | ${o.cause} | ${o.about.slice(0,140)}`),...S.challenges.map(x=>`ch:${x.id} | challenge (student pitches a project) | ${x.title} | ${x.org} | ${x.cause} | ${x.goal.slice(0,140)}`)];
 const clubs=allClubs().map(x=>`${x.id} | ${x.n} | ${x.causes.join(', ')} | ${x.about}`);
 const prompt=`You help a student find volunteer opportunities on Samaky. Every opportunity below is from a nonprofit verified with the IRS. Use ONLY ids from these lists and never mention any other organization.

The student tapped this cause: ${JSON.stringify(c)}
Their other interests: ${myCauses().slice(0,4).join(', ')}

Opportunities (id | type | title | nonprofit | cause | details):
${items.join('\n')}

Student clubs they can join (id | name | causes | about):
${clubs.join('\n')}

Pick up to 4 opportunities and up to 3 clubs that genuinely fit the cause, best first. Leave a list empty rather than force a weak fit. For each pick write "why": one plain, warm sentence to the student, at most 18 words, no hype. Also write "intro": one sentence, at most 25 words, about what these picks have in common.
Reply with only JSON like {"intro":"...","opportunities":[{"id":"meals","why":"..."}],"clubs":[{"id":"green-thumbs","why":"..."}]}`;
 try{const r=await sample.json(prompt,{modelTier:'quick',cache:force?false:true});
  const okO=new Set([...OPPS.map(o=>o.id),...S.challenges.map(x=>'ch:'+x.id)]),okC=new Set(allClubs().map(x=>x.id));
  const clean=(arr,ok,n)=>(Array.isArray(arr)?arr:[]).filter(x=>x&&ok.has(String(x.id))).slice(0,n).map(x=>({id:String(x.id),why:String(x.why||'').slice(0,180)}));
  S.ai[c]={status:'done',src:'ai',intro:String((r&&r.intro)||'').slice(0,240),opps:clean(r&&r.opportunities,okO,4),clubs:clean(r&&r.clubs,okC,3)};
 }catch(e){S.ai[c]={...ruleMatch(c),status:'done',src:'rules',note:e&&e.code==='not_granted'?'Maky’s AI is turned off for you, so these are matched by cause.':'Maky couldn’t reach AI just now, so these are matched by cause.'}}
 render()}

const avP=(n,sz)=>`<span style="width:${sz}px;height:${sz}px;flex:0 0 ${sz}px;border-radius:${sz/2}px;background:#F3E8F8;color:#520C77;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:${Math.round(sz*.34)}px">${esc(initials(n))}</span>`;
function recChip(st){return {approved:'<span class="chip" style="background:#F3E8F8;color:#520C77">Approved for credit</span>',pending:'<span class="chip wait">Needs approval</span>',notcredit:'<span class="chip bad">Not for credit</span>'}[st]}
function recRow(r,showStu){return `<div class="box stack g8" style="padding:12px 14px"><div class="row between g8" style="align-items:flex-start"><span class="stack g4" style="min-width:0"><b style="font-size:15px">${esc(showStu?r.stu.name:r.title)}</b><span class="xs q" style="line-height:1.4">${showStu?esc(r.title)+' · ':''}${esc(r.org)} · ${r.date}</span></span><b class="tnum" style="white-space:nowrap">${fmt(r.hours)} h</b></div>
 <div class="row between g8"><span class="row g4 xs" style="color:#2F6E46;font-weight:700">${ic('check',14,2.6)} Verified by nonprofit</span>${r.status==='pending'?'':recChip(r.status)}</div>
 ${r.status==='pending'?`<div class="row g8"><button class="btn small" style="flex:1" data-a="schappr" data-v="${r.stu.id}|${r.id}">Approve for credit</button><button class="btn small ghost" data-a="schno" data-v="${r.stu.id}|${r.id}">Not for credit</button></div>`:''}</div>`}
function transcriptDoc(st){const ap=st.recs.filter(r=>r.status==='approved');const tot=ap.reduce((a,r)=>a+r.hours,0);
 return `<div class="box" style="overflow:hidden;background:#FFFFFF"><div style="padding:14px 16px 10px;border-bottom:3px solid #520C77;display:flex;flex-direction:column;gap:8px"><div class="row between g8"><img src="${UST_LOGO}" alt="University of St. Thomas" style="height:30px;width:auto;display:block"><span class="xs" style="border:1px solid #9E26B5;border-radius:999px;padding:3px 8px;color:#520C77;font-weight:700">Sample</span></div><b style="font-size:13px;color:#520C77;letter-spacing:.04em">CO-CURRICULAR SERVICE TRANSCRIPT</b></div>
 <div class="stack g10" style="padding:14px 16px;font-size:13px;color:#1A1A1A"><div style="display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px"><span class="q">Student</span><b>${esc(st.name)}</b><span class="q">Email</span><span style="overflow-wrap:anywhere">${esc(st.email)}</span><span class="q">Issued</span><span>Oct 9, 2026 · ${SCHOOL.term}</span></div>
 <table style="width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums"><thead><tr style="text-align:left;color:#520C77;border-bottom:2px solid #520C77"><th style="padding:6px 4px">Date</th><th style="padding:6px 4px">Service</th><th style="padding:6px 4px;text-align:right">Hrs</th></tr></thead><tbody>${ap.map(r=>`<tr style="border-bottom:1px solid #E4DCCB"><td style="padding:7px 4px;white-space:nowrap;vertical-align:top">${r.date}</td><td style="padding:7px 4px"><b>${esc(r.title)}</b><br><span class="q">${esc(r.org)} · ${esc(r.cause)}</span></td><td style="padding:7px 4px;text-align:right;vertical-align:top">${fmt(r.hours)}</td></tr>`).join('')||'<tr><td colspan="3" class="q" style="padding:10px 4px">No hours approved for credit yet.</td></tr>'}</tbody><tfoot><tr><td colspan="2" style="padding:8px 4px;font-weight:700">Total approved for credit</td><td style="padding:8px 4px;text-align:right;font-weight:700">${fmt(tot)}</td></tr></tfoot></table>

const rbChip=s=>({submitted:'<span class="chip wait">Waiting for approval</span>',approved:'<span class="chip" style="background:#F3E8F8;color:#520C77">Approved</span>',paid:'<span class="chip ok">Paid</span>',denied:'<span class="chip bad">Denied</span>'}[s]||'');

 {img:()=>PHOTO,pos:'center 20%',h:'It’s friction, not character.',p:'Most people want to help. Samaky makes it easy to find a shift with a verified nonprofit, show up, and get your hours confirmed.',b:'Get started'},
 {img:()=>PHOTO_B,pos:'center 35%',h:'One ID. Verified Opportunities.',p:'Build one profile and volunteer anywhere on Samaky. No new sign-ups, no starting over.',b:'Next'},
 {maky:true,h:'Here to Catalyze Kindness',p:'We make kindness easy — one place to find volunteer opportunities and show up for your community.',b:'Explore'}];
function obDots(i){return OB_SLIDES.map((_,k)=>`<i style="width:${k===i?22:8}px;height:8px;border-radius:4px;background:${k===i?'#F5C842':'rgba(255,255,255,.45)'};display:block;transition:width .3s,background .3s"></i>`).join('')}
function renderOb(){const step=Math.min(Math.max(S.ob|0,0),2);S.ob=step;
 const slide=(d,k)=>{const bg=d.maky?'background:linear-gradient(180deg,#2F6E46 0%,#1F4D33 62%,#12301F 100%)':`background:#1A1A1A url('${d.img()}') ${d.pos}/cover no-repeat`;
  const art=d.maky?`<div aria-hidden="true" style="position:absolute;left:0;right:0;top:22%;display:flex;justify-content:center"><span style="width:200px;height:200px;border-radius:100px;background:rgba(255,253,248,.10);display:flex;align-items:center;justify-content:center"><img src="${MAKY}" alt="" style="width:150px;height:150px;border-radius:75px;object-fit:cover;background:#FFFDF8;box-shadow:0 10px 30px rgba(0,0,0,.25)"></span></div>`:'';

  ${d.maky?'':`<div aria-hidden="true" style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,20,14,.32) 0%,rgba(10,20,14,0) 14%,rgba(10,20,14,0) 50%,rgba(18,48,31,.78) 70%,rgba(18,48,31,.96) 100%)"></div>`}${art}
  <div style="position:relative;padding:28px 24px 0"><img src="${LOGO}" alt="Samaky" style="width:150px;height:auto;display:block"></div>
  <div class="stack g16" style="position:relative;padding:0 24px 30px"><h1 class="disp" style="font-size:46px;line-height:1.02;letter-spacing:-.02em">${d.h}</h1><p style="margin:0;font-size:16px;line-height:1.5;color:#E3EFE7">${d.p}</p>
  <div class="row g6 obdots" aria-hidden="true" style="justify-content:center;margin-top:4px">${obDots(k)}</div>
  <div class="stack g4" style="margin-top:4px"><button class="btn yellow block" data-a="${k===2?'ob-explore':'ob-next'}" ${k===step?'':'tabindex="-1"'}>${d.b}</button><button class="link" style="color:#FFFFFF;align-self:center" data-a="tologin" ${k===step?'':'tabindex="-1"'}>I already have an account</button></div></div></section>`};
 return `<div class="full" id="obwrap" style="position:relative;height:100%;overflow:hidden;touch-action:pan-y" aria-roledescription="carousel" aria-label="Welcome to Samaky"><div id="obtrack" style="display:flex;height:100%;transform:translateX(${-step*100}%);transition:transform .35s cubic-bezier(.2,.8,.2,1)">${OB_SLIDES.map(slide).join('')}</div></div>`}
function obGo(i){i=Math.min(Math.max(i,0),2);S.ob=i;const t=document.getElementById('obtrack');if(!t){render();return}t.style.transition='transform .35s cubic-bezier(.2,.8,.2,1)';t.style.transform=`translateX(${-i*100}%)`;
 t.querySelectorAll('.obslide').forEach((el,k)=>{if(k===i)el.removeAttribute('aria-hidden');else el.setAttribute('aria-hidden','true');el.querySelectorAll('button').forEach(b=>{if(k===i)b.removeAttribute('tabindex');else b.setAttribute('tabindex','-1')})});save()}
(function(){let x0=null,y0=0,dx=0,w=1,drag=false;
 document.addEventListener('pointerdown',e=>{const wr=e.target.closest&&e.target.closest('#obwrap');if(!wr)return;x0=e.clientX;y0=e.clientY;dx=0;drag=false;w=wr.getBoundingClientRect().width||1});
 document.addEventListener('pointermove',e=>{if(x0===null)return;dx=e.clientX-x0;if(!drag&&Math.abs(dx)>8&&Math.abs(dx)>Math.abs(e.clientY-y0))drag=true;if(!drag)return;const t=document.getElementById('obtrack');if(!t)return;let d=dx;if((S.ob===0&&d>0)||(S.ob===2&&d<0))d=d/3;t.style.transition='none';t.style.transform=`translateX(calc(${-S.ob*100}% + ${d/(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--s'))||1)}px))`});
 const up=()=>{if(x0===null)return;const was=drag;x0=null;if(!was)return;const th=w*0.18;obGo(dx<-th?S.ob+1:dx>th?S.ob-1:S.ob)};
 document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
 document.addEventListener('click',e=>{if(drag&&e.target.closest&&e.target.closest('#obwrap')){e.stopPropagation();e.preventDefault();drag=false}},true);
 document.addEventListener('keydown',e=>{if(!document.getElementById('obwrap'))return;if(e.key==='ArrowRight')obGo(S.ob+1);if(e.key==='ArrowLeft')obGo(S.ob-1)})})();

const FILTERS=[['near','Near me'],['weekend','This weekend'],['remote','From home'],['group','Good for groups'],['quest','Quests'],['access','Accessible'],['challenge','Challenges']];

 return S.challenges.filter(c=>(!q||(c.title+' '+c.org+' '+c.cause+' challenge project pitch').toLowerCase().includes(q))&&(!S.cause||c.cause===S.cause))}
function results(){const q=S.query.trim().toLowerCase();const f=S.filters;if(f.challenge)return [];

 npnewch(){S.formErr='';S.draft={ct:'',cg:'',cp:'',cc:'Seniors',cd:'Nov 30',ci1:'',ci2:'',ci3:''};S.sheet={t:'npch'}},
 npchpost(){const d=S.draft;S.formErr='';if(!(d.ct||'').trim())return S.formErr='Name the challenge.';if((d.cg||'').trim().length<20)return S.formErr='Describe the problem in a sentence or two.';
  S.challenges.push({id:'c'+Date.now(),title:d.ct.trim(),org:NP_ORG,ini:'ES',type:'501(c)(3)',cause:d.cc,dist:2.1,x:74,y:28,dl:d.cd,goal:d.cg.trim(),provide:(d.cp||'').trim()||'A staff contact who will help you plan.',deck:[d.ci1,d.ci2,d.ci3].map(t=>(t||'').trim()).filter(Boolean).map(t=>({t,d:`Idea from ${NP_ORG}.`}))});
  S.sheet=null;S.draft={};toast('Challenge posted. Students can start pitching now.')},
 student(){S.np=false;S.view='home';if(S.celebrate){S.sheet={t:'celebrate',id:S.celebrate};S.celebrate=null}},
 npverify(v){if(v.startsWith('me:'))verifyMine(v.slice(3));else{const o=S.others.find(x=>x.id===v);o.status='verified';nextSession(o.opp)}toast('Verified')},
 npnoshow(v){if(v.startsWith('me:')){const k=v.slice(3);S.signups[k]='notverified';notify(`${opp(k).org} could not verify your shift. You can ask them to review it once.`,'bell','calendar')}else S.others.find(o=>o.id===v).status='notverified'},
 npadj(v){const [id,d]=v.split('|');if(id.startsWith('me:')){const k=id.slice(3);S.adj[k]=Math.max(0.5,hrs(k)+ +d)}else{const o=S.others.find(x=>x.id===id);o.hours=Math.max(0.5,o.hours+ +d)}},
 npverifyall(){Object.keys(S.signups).forEach(k=>{if(S.signups[k]==='pending')verifyMine(k)});S.others.slice().forEach(o=>{if(o.status==='pending'){o.status='verified';nextSession(o.opp)}});toast('All hours verified')},
 nppresent(v){if(v.startsWith('me:')){const k=v.slice(3);S.signups[k]='pending';notify(`Your ${fmt(hrs(k))} hours at ${opp(k).org} are waiting for verification.`,'clock','calendar')}else{const o=S.others.find(x=>x.id===v);if(o)o.status='pending'}},
 transcript(){S.sheet={t:'transcript'}},
 share(){copy('https://samakian.com/'+(S.name||'me').toLowerCase());toast('Profile link copied')},
 addcal(){toast('Added to your calendar (simulated)')},
 invite(){copy('https://samakian.com/invite');toast('Invite link copied. Send it to a friend.')},
 gonext(){S.sheet=null;go('search')},
 close(){S.sheet=null;S.pendingSignup=null},
 scrim(){},
 reset(){if(!S.resetArm){S.resetArm=true;setTimeout(()=>{S.resetArm=false;render()},4000);return}try{localStorage.removeItem(KEY)}catch(e){}S=fresh();toast('Demo reset')}
};
function copy(t){try{navigator.clipboard.writeText(t).catch(()=>{})}catch(e){}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;
 if(a==='scrim'){if(e.target===el){S.sheet=null;S.pendingSignup=null;render()}return}
 const f=A[a];if(!f)return;e.preventDefault();const r=f(el.dataset.v);if(r===false)return;render()});
document.addEventListener('input',e=>{const f=e.target.dataset&&e.target.dataset.f;if(f){S.draft[f]=e.target.value;save();if(f==='rm'||f==='ra'){const t=document.getElementById('rbtotal');if(t)t.textContent=money(rbAmount())}return}if(e.target.id==='q'){S.query=e.target.value;S.mapSel=null;const r=document.getElementById('results');if(r)r.innerHTML=S.sMode==='np'?npListHTML():resultsHTML();const c=document.getElementById('count');if(c)c.textContent=countText();save()}});
document.addEventListener('change',e=>{if(e.target.id==='f-rr'){const fl=e.target.files&&e.target.files[0];S.draft.rr=fl?fl.name:'';render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet){S.sheet=null;render()}});
fit();render();
})();
